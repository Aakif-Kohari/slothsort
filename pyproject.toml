[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slothsort"
version = "0.1.0"
description = "A lazy, local-first Downloads tidier powered by an open-weight model (Gemma via Ollama)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
slothsort = "slothsort.cli:main"

[tool.setuptools]
packages = ["slothsort"]
